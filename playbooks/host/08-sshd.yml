---
# Final SSH listen addresses and the accounts allowed to log in.
#
# The host access bootstrap has already moved sshd to the managed port, proven
# login and sudo there, recorded the port in the AAP inventory and closed port
# 22 on the public zone. This stage narrows sshd to exactly two addresses: the
# public address on the managed port, and the internal libvirt bridge address
# on port 22, where the VMs (AAP's among them) reach the hypervisor. It runs
# after the libvirt networks stage, which creates the bridge, and the users
# stage, which creates the accounts AllowUsers names.
#
# Port 22 is reachable on the bridge: libvirt puts its bridges in firewalld's
# libvirt zone, which allows the ssh service by default.
#
# The managed port applies to this hypervisor only; the VMs keep SSH on port 22.
#
# Required variables:
#   host_ssh_port          vault: managed SSH port
#   host_ssh_allow_users   vault: accounts allowed to log in, including ansible
#   dns_host_ipv4          vault: public IPv4 of the host, as for the host DNS stage
#   net_internal           vault: the internal network; its address is the bridge's

- name: Listen on the public managed port and the bridge, allow the declared users
  hosts: autodeploy_target
  become: true
  vars_files:
    - ../vars/sshd-hardening.yml
  tasks:
    # sshd may start at boot before libvirt has created the bridge. Without
    # this, it would skip the bridge address and never listen there.
    - name: Let sshd bind addresses that are not up yet
      ansible.posix.sysctl:
        name: net.ipv4.ip_nonlocal_bind
        value: "1"
        sysctl_file: /etc/sysctl.d/80-sshd-nonlocal-bind.conf
        sysctl_set: true
        reload: true

    # The bootstrap labelled the managed port in SELinux. Port only keeps
    # sshd -T truthful; each ListenAddress carries its own port.
    - name: Listen on the public managed port and the bridge only
      ansible.builtin.include_role:
        name: redhat.rhel_system_roles.sshd
      vars:
        sshd_config_file: "{{ host_sshd_config_file }}"
        sshd_config: >-
          {{ host_sshd_hardening | combine({'AllowUsers': host_ssh_allow_users | join(' '),
          'Port': host_ssh_port | int,
          'ListenAddress': [dns_host_ipv4 ~ ':' ~ host_ssh_port, net_internal.address ~ ':22']}) }}

    - name: Apply the SSH configuration now
      ansible.builtin.meta: flush_handlers
