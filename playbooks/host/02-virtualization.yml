---
# KVM and libvirt with RHEL 9's default modular daemons.
#
# A fresh RHEL 9 uses the modular libvirt daemons (virtqemud, virtnetworkd,
# virtstoraged), so the units are fixed here instead of detected.
# NTFS support (ntfs-3g, libguestfs-winsupport) belongs to the Windows use case.

- name: Configure virtualization
  hosts: autodeploy_target
  become: true
  gather_facts: false
  vars:
    host_virtualization_packages:
      - qemu-kvm
      - libvirt
      - libvirt-client
      - python3-libvirt
      - python3-lxml
      - virt-install
      - guestfs-tools
    host_libvirt_daemons: [virtqemud, virtnetworkd, virtstoraged]
  tasks:
    - name: Install KVM, libvirt and the image tools
      ansible.builtin.dnf:
        name: "{{ host_virtualization_packages }}"
        state: present

    - name: Enable the libvirt API sockets
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop: "{{ host_libvirt_daemons | product(['.socket', '-ro.socket', '-admin.socket']) | map('join') | list }}"

    # VMs and networks set to autostart need the daemons running at boot, not
    # only when a client first connects to a socket.
    - name: Start the libvirt daemons at boot
      ansible.builtin.systemd_service:
        name: "{{ item }}.service"
        enabled: true
        state: started
      loop: "{{ host_libvirt_daemons }}"

    - name: Point virsh at the system VMs in every shell
      ansible.builtin.copy:
        dest: /etc/profile.d/libvirt-uri.sh
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by aap-autodeploy-configascode
          export LIBVIRT_DEFAULT_URI=qemu:///system
