---
# Users, SSH keys and sudo for the people working on the host.
#
# The ansible account already exists: the host access bootstrap created it and
# proved its login and sudo before root login was turned off. This stage adds
# the remaining users. Admins are members of wheel, which has passwordless
# sudo.
#
# Required variables (vault):
#   host_users             list of {name, uid, gid (optional), groups}; admins include wheel
#   host_authorized_keys   dict: user name -> list of public keys

- name: Configure the users
  hosts: autodeploy_target
  become: true
  gather_facts: false
  tasks:
    - name: Create the groups with fixed IDs
      ansible.builtin.group:
        name: "{{ item.name }}"
        gid: "{{ item.gid | default(item.uid) }}"
        state: present
      loop: "{{ host_users }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create the users with fixed IDs and exact groups
      ansible.builtin.user:
        name: "{{ item.name }}"
        uid: "{{ item.uid }}"
        group: "{{ item.name }}"
        groups: "{{ item.groups | default([]) }}"
        append: false
        state: present
      loop: "{{ host_users }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Allow exactly the declared SSH keys
      ansible.posix.authorized_key:
        user: "{{ item.name }}"
        key: "{{ host_authorized_keys[item.name] | join('\n') }}"
        exclusive: true
        state: present
      loop: "{{ host_users }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Allow passwordless sudo for wheel
      ansible.builtin.copy:
        dest: /etc/sudoers.d/wheel-nopasswd
        owner: root
        group: root
        mode: "0440"
        content: |
          # Managed by aap-autodeploy-configascode
          %wheel ALL=(ALL) NOPASSWD: ALL
        validate: /usr/sbin/visudo -cf %s
