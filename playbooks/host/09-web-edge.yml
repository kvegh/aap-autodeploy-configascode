---
# The internet-facing part of the hypervisor: nginx as the front door,
# certbot for its certificates, fail2ban to ban abusers.
#
# Base only. nginx is installed and configured but neither enabled nor
# started: the AAP deployment (WF2) starts it. fail2ban runs with the sshd
# jail only. Every use case brings its own nginx vhost (conf.d), certificate,
# basic-auth file and fail2ban jails for its nginx logs (jail.d). Use case
# vhosts reference the shared /etc/letsencrypt/ssl-dhparams.pem and must not
# include certbot's options-ssl-nginx.conf, which is not installed. The AAP
# login rate limit (limit_req_zone and the vhost's limit_req) protects AAP's
# login, so it comes with WF2, not here.
#
# Required variables:
#   host_ssh_port             vault: managed SSH port, for the sshd jail
#   host_trusted_public_ips   vault: public IPs of our own hosts and AAP, never banned
#
# The fail2ban jail is defined below; it holds nothing secret. The sshd jail
# reads the journal (the RHEL default backend), so it needs no log file.

- name: Configure the web edge
  hosts: autodeploy_target
  become: true
  gather_facts: false
  vars_files:
    - ../vars/host-services.yml
  vars:
    host_fail2ban_jails:
      DEFAULT:
        # Our own hosts and AAP are never banned: a check that proves root
        # login is refused attempts that login from AAP and must not lock it out.
        ignoreip: "{{ (['127.0.0.1/8', '::1'] + host_trusted_public_ips) | join(' ') }}"
        bantime: 1h
        findtime: 10m
        banaction: firewallcmd-rich-rules
      sshd:
        enabled: "true"
        port: "{{ host_ssh_port }}"
        maxretry: 4
  handlers:
    # nginx is not running here, so there is nothing to reload; a reload
    # would start it. The test only proves the configuration loads.
    - name: Check the nginx configuration
      ansible.builtin.command:
        argv: [nginx, -t]
      changed_when: false

    # Handlers run in the order listed here, so the test runs before the
    # reload; if it fails, the reload does not happen. No module validates
    # fail2ban configuration, so its own test is the check.
    - name: Test the fail2ban configuration
      ansible.builtin.command:
        argv: [fail2ban-client, -t]
      changed_when: false

    - name: Reload fail2ban
      ansible.builtin.systemd_service:
        name: fail2ban
        state: reloaded
  tasks:
    - name: Install nginx, certbot and fail2ban
      ansible.builtin.dnf:
        name: [nginx, certbot, fail2ban]
        state: present

    - name: Render the nginx base configuration
      ansible.builtin.template:
        src: "templates/{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - {src: nginx.conf.j2, dest: /etc/nginx/nginx.conf}
        - {src: 00-default.conf.j2, dest: /etc/nginx/conf.d/00-default.conf}
      notify: Check the nginx configuration

    # One public file for all vhosts: the standard RFC 7919 ffdhe2048 group.
    # It holds no secret; each vhost keeps its own certificate and key.
    - name: Install the shared Diffie-Hellman parameters
      ansible.builtin.copy:
        src: files/ssl-dhparams.pem
        dest: /etc/letsencrypt/ssl-dhparams.pem
        owner: root
        group: root
        mode: "0644"

    - name: Create the Let's Encrypt challenge directory
      ansible.builtin.file:
        path: /var/lib/letsencrypt/.well-known/acme-challenge
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install the fail2ban jail
      ansible.builtin.template:
        src: templates/fail2ban-jails.local.j2
        dest: /etc/fail2ban/jail.d/hypervisor.local
        owner: root
        group: root
        mode: "0644"
      notify:
        - Test the fail2ban configuration
        - Reload fail2ban

    - name: Start fail2ban and certificate renewal at boot
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop: "{{ host_web_edge_services + host_web_edge_timers }}"
