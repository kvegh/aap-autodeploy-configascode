---
# firewalld: web ports.
#
# The host access bootstrap already runs firewalld, binds the public interface
# to the public zone, opens the managed SSH port and closes port 22 there.
# This stage adds the web ports.
#
# The role adds the listed rules; it does not remove rules dropped from this
# list. Handling removals in CaC is a separate project to-do.

- name: Configure the firewall
  hosts: autodeploy_target
  become: true
  tasks:
    - name: Open the web ports
      ansible.builtin.include_role:
        name: redhat.rhel_system_roles.firewall
      vars:
        firewall:
          - zone: public
            service: [http, https]
            state: enabled
            permanent: true
            runtime: true
