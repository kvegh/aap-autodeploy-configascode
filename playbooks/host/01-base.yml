---
# Base settings of the hypervisor: EPEL, names, timezone, packages and the
# always-on local services (performance history and hardware health).
#
# EPEL comes first so every later stage can rely on it (certbot and fail2ban in
# the web edge stage, rclone in the image download). CodeReady Builder is not
# enabled: no package we install, nor any of their dependencies, comes from it.
#
# Required variables:
#   autodeploy_deployment_version   from the deployment version stage, e.g. v26
#   dns_host_label, dns_zone, dns_host_ipv4   as for the host DNS stage
#   host_timezone                   e.g. Europe/Vienna

- name: Configure the hypervisor base
  hosts: autodeploy_target
  become: true
  gather_facts: false
  vars_files:
    - ../vars/host-services.yml
  vars:
    host_short_name: "{{ dns_host_label }}-{{ autodeploy_deployment_version }}"
    host_fqdn: "{{ dns_host_label }}.{{ autodeploy_deployment_version }}.{{ dns_zone }}"
    epel_gpg_key_url: https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-9
    epel_release_url: https://dl.fedoraproject.org/pub/epel/epel-release-latest-9.noarch.rpm
    host_base_packages:
      # SELinux tooling other modules need (labels, ports)
      - policycoreutils-python-utils
      - python3-libselinux
      # Administration tools for the people working on the host
      - vim-enhanced
      - nano
      - tmux
      - wget
      - bind-utils
      - pciutils
      - mlocate
      - git
      - sysstat
      # Local hardware health monitors
      - smartmontools
      - rasdaemon
  handlers:
    - name: Restart rasdaemon with the serialized start
      ansible.builtin.systemd_service:
        name: rasdaemon
        state: restarted
        daemon_reload: true
  tasks:
    - name: Trust the EPEL signing key
      ansible.builtin.rpm_key:
        key: "{{ epel_gpg_key_url }}"
        state: present

    - name: Enable EPEL
      ansible.builtin.dnf:
        name: "{{ epel_release_url }}"
        state: present

    - name: Set the hostname
      ansible.builtin.hostname:
        name: "{{ host_short_name }}"

    - name: Map the host names to the public address
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^{{ dns_host_ipv4 | regex_escape }}\s'
        line: "{{ dns_host_ipv4 }} {{ host_fqdn }} {{ host_short_name }}"
        owner: root
        group: root
        mode: "0644"

    - name: Set the timezone
      community.general.timezone:
        name: "{{ host_timezone }}"

    - name: Install the base packages
      ansible.builtin.dnf:
        name: "{{ host_base_packages }}"
        state: present

    # RHEL 9 still ships rasdaemon 0.6.7, whose unit runs "rasdaemon --enable"
    # in parallel with the daemon start (ExecStartPost). The daemon can then
    # fail to open its tracing clock and exit, leaving the service inactive.
    # This was observed on the rebuilt host after a reboot in November 2026.
    # Upstream issue: https://github.com/mchehab/rasdaemon/issues/74 (fixed in
    # newer rasdaemon). Running the enable step before the start serializes
    # it. Remove this drop-in once RHEL ships a fixed rasdaemon.
    - name: Create the rasdaemon drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/rasdaemon.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Serialize the rasdaemon start
      ansible.builtin.copy:
        dest: /etc/systemd/system/rasdaemon.service.d/10-serial-start.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by aap-autodeploy-configascode, see upstream rasdaemon issue 74.
          [Service]
          ExecStartPost=
          ExecStartPre=/usr/sbin/rasdaemon --enable
      notify: Restart rasdaemon with the serialized start

    - name: Enable performance history and hardware health monitors
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop: "{{ host_base_services }}"
