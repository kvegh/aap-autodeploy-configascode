---
# Start nginx on the hypervisor and obtain the Let's Encrypt certificate of
# the AAP name, for example aap27.v29.<zone>.
#
# The AAP DNS job (11-dns-record-publish.yml with the AAP name) runs first, so
# public DNS already points the name at the hypervisor. The host setup's web
# edge stage installed nginx and certbot, created the webroot
# /var/lib/letsencrypt and enabled the renewal timer, but left nginx stopped.
# The AAP vhost that uses the certificate is written after the AAP install.
#
# Rerunnable: nginx is left running, and certbot is skipped once the
# certificate exists.
#
# Runs as the automation account on the port the host access bootstrap
# recorded in the AAP inventory.
#
# Required variables, from the CaC inventory:
#   vm_fqdn          AAP name, for example aap27.v29.example.com
#   host_certbot_email   contact address of the Let's Encrypt account

- name: Obtain the AAP certificate on the hypervisor
  hosts: autodeploy_target
  become: true
  gather_facts: false
  tasks:
    - name: Start nginx now and at boot
      ansible.builtin.systemd_service:
        name: nginx
        enabled: true
        state: started

    # certbot is the hypervisor's ACME client (web edge stage); no module
    # drives it. --webroot leaves the nginx configuration untouched.
    - name: Obtain the Let's Encrypt certificate of the AAP name
      ansible.builtin.command:
        argv:
          - certbot
          - certonly
          - --webroot
          - --webroot-path
          - /var/lib/letsencrypt
          - --domain
          - "{{ vm_fqdn }}"
          - --email
          - "{{ host_certbot_email }}"
          - --agree-tos
          - --non-interactive
        creates: "/etc/letsencrypt/live/{{ vm_fqdn }}/fullchain.pem"
