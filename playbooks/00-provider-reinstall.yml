---
# Reinstall one explicitly confirmed dedicated server with Rocky Linux 9 and
# wait until it answers on SSH again.
#
# This playbook erases the target. It makes no provider write before both the
# target confirmations and the production exclusion have passed.
#
# Required variables, supplied by an encrypted inventory or credential injection:
#   robot_username, robot_password   provider API account
#   robot_server_number              provider server number of the target
#   robot_expected_server_ip         primary IPv4 of the target
#   robot_protected_server_ips       addresses this playbook must never erase
#   robot_ssh_keys                   list of {name, public_key} for root login
#   robot_install_distribution       exact provider image name for Rocky Linux 9
#   robot_install_language           installer language, for example en
#   aap_inventory_name               AAP inventory that holds the target host
#   aap_inventory_host_name          the target's host name in that inventory
#
# Credentials: the provider API credential, and the standard Red Hat Ansible
# Automation Platform credential, which hands the controller URL and login to
# ansible.controller as environment variables.
#
# Required confirmations, supplied by the job template survey:
#   robot_confirm_server_number      must equal robot_server_number
#   robot_confirm_server_ip          must equal robot_expected_server_ip
#   robot_confirm_erase              must be "ERASE <robot_server_number>"
#
# Reaching SSH again does not prove the installation is fresh. The final tasks
# prove the server presents the host keys the provider reports for the last
# installation, which only the finished installation has.

- name: Reinstall the confirmed provider server with Rocky Linux 9
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Query the selected dedicated server
      community.hrobot.server_info:
        hetzner_user: "{{ robot_username }}"
        hetzner_password: "{{ robot_password }}"
        server_number: "{{ robot_server_number | int }}"
      register: provider_server
      check_mode: false

    - name: Verify the provider returned the expected ready server
      ansible.builtin.assert:
        that:
          - provider_server.servers | length == 1
          - provider_server.servers[0].server_number | int == robot_server_number | int
          - provider_server.servers[0].server_ip == robot_expected_server_ip
          - provider_server.servers[0].status == 'ready'
          - not provider_server.servers[0].cancelled | bool
        fail_msg: The provider target is not the selected ready server.

    - name: Confirm the exact provider target before erasing it
      ansible.builtin.assert:
        that:
          - robot_confirm_server_number | int == robot_server_number | int
          - robot_confirm_server_ip == robot_expected_server_ip
          - robot_confirm_erase == 'ERASE ' ~ (robot_server_number | string)
        fail_msg: >-
          Confirm the exact server number, its primary IP and the ERASE phrase
          before any provider write.

    - name: Reject protected production addresses
      ansible.builtin.assert:
        that:
          - robot_protected_server_ips | length > 0
          - robot_expected_server_ip not in robot_protected_server_ips
        fail_msg: The target must not be one of the protected production addresses.

    # The SSH stage records the managed port as ansible_port on the target's
    # AAP inventory host. The reinstalled host answers on port 22 again, so
    # the port is removed before the erase. This is an AAP write, so it comes
    # after the confirmations. The current host variables are read and the
    # rest written back unchanged.
    - name: Let later jobs reach the reinstalled host on port 22 again
      ansible.controller.host:
        name: "{{ aap_inventory_host_name }}"
        inventory: "{{ aap_inventory_name }}"
        variables: "{{ aap_host_variables | dict2items | rejectattr('key', 'equalto', 'ansible_port') | items2dict }}"
      vars:
        aap_host_variables: >-
          {{ (lookup('ansible.controller.controller_api', 'hosts', expect_one=true,
          query_params={'name': aap_inventory_host_name, 'inventory__name': aap_inventory_name}).variables
          | from_yaml) | default({}, true) }}

    - name: Register the reviewed SSH public keys
      community.hrobot.ssh_key:
        hetzner_user: "{{ robot_username }}"
        hetzner_password: "{{ robot_password }}"
        state: present
        name: "{{ item.name }}"
        public_key: "{{ item.public_key }}"
      loop: "{{ robot_ssh_keys }}"
      loop_control:
        label: "{{ item.name }}"
      register: provider_keys

    - name: Collect the registered key fingerprints
      ansible.builtin.set_fact:
        provider_key_fingerprints: "{{ provider_keys.results | map(attribute='fingerprint') | list }}"

    - name: Arm the Rocky Linux 9 installation for the next boot
      community.hrobot.boot:
        hetzner_user: "{{ robot_username }}"
        hetzner_password: "{{ robot_password }}"
        server_number: "{{ robot_server_number | int }}"
        install_linux:
          dist: "{{ robot_install_distribution }}"
          lang: "{{ robot_install_language }}"
          authorized_keys: "{{ provider_key_fingerprints }}"

    - name: Reset the server into the installer
      community.hrobot.reset:
        hetzner_user: "{{ robot_username }}"
        hetzner_password: "{{ robot_password }}"
        server_number: "{{ robot_server_number | int }}"
        reset_type: hardware

    # The provider installs from its rescue system, which also answers on SSH,
    # so SSH alone cannot tell the installer from the installed system. Wait
    # until the provider has consumed the installation request first. In check
    # mode the boot module only reports whether it would still deactivate an
    # active configuration, so this changes nothing.
    - name: Wait until the provider has consumed the installation request
      community.hrobot.boot:
        hetzner_user: "{{ robot_username }}"
        hetzner_password: "{{ robot_password }}"
        server_number: "{{ robot_server_number | int }}"
        regular_boot: true
      check_mode: true
      register: provider_boot_state
      until: not provider_boot_state.changed
      retries: 60
      delay: 30

    - name: Wait for the reinstalled server to answer on SSH
      ansible.builtin.wait_for:
        host: "{{ robot_expected_server_ip }}"
        port: 22
        state: started
        delay: 120
        timeout: 1800
        search_regex: OpenSSH

    # No community.hrobot module returns the host keys of the last
    # installation, so the Robot webservice is read directly (read-only).
    - name: Read the host keys the provider reports for the last installation
      ansible.builtin.uri:
        url: "https://robot-ws.your-server.de/boot/{{ robot_server_number | int }}/linux/last"
        method: GET
        url_username: "{{ robot_username }}"
        url_password: "{{ robot_password }}"
        force_basic_auth: true
        validate_certs: true
        return_content: true
        status_code: 200
        timeout: 30
      register: provider_last_install
      until: provider_last_install.json.linux.host_key | default([]) | length > 0
      retries: 20
      delay: 15

    # No Ansible module reads a server's host key without connecting to it.
    # ssh-keyscan and ssh-keygen run on the controller; nothing runs on the
    # managed node. The pipe needs a shell.
    - name: Read the host keys the reinstalled server presents
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          ssh-keyscan -T 10 -p 22 {{ robot_expected_server_ip | quote }} 2>/dev/null
          | ssh-keygen -lf -
        executable: /bin/bash
      changed_when: false
      register: provider_presented_keys
      until: >-
        (provider_presented_keys.stdout_lines | map('split') | map(attribute='1')
        | map('regex_replace', '^SHA256:', '') | sort | list)
        == (provider_last_install.json.linux.host_key | map(attribute='key')
        | map(attribute='fingerprint') | map('regex_replace', '^SHA256:', '') | sort | list)
      retries: 20
      delay: 15

    - name: Verify the server presents the freshly installed host keys
      ansible.builtin.assert:
        that:
          - >-
            (provider_presented_keys.stdout_lines | map('split') | map(attribute='1')
            | map('regex_replace', '^SHA256:', '') | sort | list)
            == (provider_last_install.json.linux.host_key | map(attribute='key')
            | map(attribute='fingerprint') | map('regex_replace', '^SHA256:', '') | sort | list)
        fail_msg: >-
          The server does not present the host keys the provider reports for the
          last installation; the installation may not have finished.
