---
# Configure the converted and updated RHEL 9 host as the hypervisor.
#
# One job: the stages below run in this order. Each stage is also a playbook of
# its own in playbooks/host/ and can be run alone on a finished host.
#
# Inventory: the host in group autodeploy_target, reached as ansible on the
# port recorded in the AAP inventory. Variables are listed in each stage's
# header; secrets and environment details come from the vault.

- name: Base settings
  ansible.builtin.import_playbook: host/01-base.yml

- name: Virtualization
  ansible.builtin.import_playbook: host/02-virtualization.yml

- name: SELinux
  ansible.builtin.import_playbook: host/03-selinux.yml

- name: VM storage
  ansible.builtin.import_playbook: host/04-storage.yml

- name: Libvirt networks
  ansible.builtin.import_playbook: host/05-libvirt-networks.yml

- name: Users
  ansible.builtin.import_playbook: host/06-users.yml

- name: Firewall
  ansible.builtin.import_playbook: host/07-firewall.yml

- name: SSH hardening and port move
  ansible.builtin.import_playbook: host/08-sshd.yml

- name: Web edge
  ansible.builtin.import_playbook: host/09-web-edge.yml

- name: Tuning
  ansible.builtin.import_playbook: host/10-tuning.yml
