---
# Make the RHEL host under AAP trust the CA that signed AAP's own certificate.
#
# Jobs that call AAP's API by its name (the CaC apply job) run in execution
# environment containers on that host. AAP's job setting "Paths to expose to
# isolated jobs" already mounts the host's /etc/pki/ca-trust into every job
# container (overlay), so once the host trusts the CA, every EE does too, with
# no EE rebuild and no certificate copies in the repositories.
#
# The CA certificate is the one the AAP installer generated; it already sits
# on the host, so it is copied there (remote_src) and never stored in Git.
#
# Required inventory: the host aap-platform (the AAP VM), reachable over SSH
# as an account with sudo.
#
# Required variables, from the CaC host variables:
#   ca_trust_source_path   the installer's CA certificate on the host
#   ca_trust_anchor_name   file name of the trust anchor

- name: Trust the AAP installer CA on the AAP host
  hosts: aap-platform
  become: true
  gather_facts: false
  handlers:
    # No module rebuilds the system trust store; update-ca-trust is the RHEL
    # tool for it.
    - name: Rebuild the system trust store
      ansible.builtin.command:
        argv: [update-ca-trust, extract]
      changed_when: true
  tasks:
    - name: Install the AAP installer CA as a trust anchor
      ansible.builtin.copy:
        src: "{{ ca_trust_source_path }}"
        dest: "/etc/pki/ca-trust/source/anchors/{{ ca_trust_anchor_name }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      notify: Rebuild the system trust store
