---
# Download the -secrets repository of one use case and load its vault, for
# usecase-aap-infra.yml, usecase-aap-config.yml and usecase-aap-content.yml.
#
# The private repository gives the vault (the target AAP's token, the vault
# password) and the use case catalog; the catalog entry gives the use case's
# -secrets repository, its ref and the vault variable with the GitHub read
# token for it (a name, so other use cases' tokens may be missing). Every use
# case repository has the same layout: its vault file env_variables.yml at the
# root and the sections aap-infra/, aap-config/ and aap-content/ next to it.
# Both downloads stay in the execution environment's scratch directories,
# which go away with the job.
#
# Required variables, from the job template, the workflow and the deployer:
#   cac_repository, cac_repository_ref, cac_usecase
#                          private repository, ref and use case whose
#                          env_variables.yml is the vault file
#   counter_git_username   GitHub account and token that read the private
#   counter_git_token      repository, from its credential
#   usecase_catalog_file   catalog file in the private repository
#   usecase_name           use case, a key of the catalog
# The calling playbook defines usecase (the catalog entry); this file
# registers usecase_scratch (the downloaded repository).

- name: Download the private repository
  ansible.builtin.import_tasks: private-repository-download.yml

- name: Load the vault values of the private repository
  ansible.builtin.include_vars:
    file: "{{ cac_scratch.path }}/usecases/{{ cac_usecase }}/env_variables.yml"
  no_log: true

- name: Load the use case catalog
  ansible.builtin.include_vars:
    file: "{{ cac_scratch.path }}/{{ usecase_catalog_file }}"

- name: Create a scratch directory for the use case repository
  ansible.builtin.tempfile:
    state: directory
    suffix: .usecase
  register: usecase_scratch

- name: Download the use case repository at its ref
  ansible.builtin.get_url:
    url: "https://api.github.com/repos/{{ usecase.repository }}/tarball/{{ usecase.ref }}"
    dest: "{{ usecase_scratch.path }}/repository.tar.gz"
    url_username: "{{ counter_git_username }}"
    url_password: "{{ lookup('ansible.builtin.vars', usecase.token_variable) }}"
    force_basic_auth: true
    headers:
      Accept: application/vnd.github+json
      X-GitHub-Api-Version: "2022-11-28"
    mode: "0600"
    timeout: 60

- name: Unpack the use case repository
  ansible.builtin.unarchive:
    src: "{{ usecase_scratch.path }}/repository.tar.gz"
    dest: "{{ usecase_scratch.path }}"
    remote_src: true
    extra_opts:
      - --strip-components=1

- name: Load the vault values of the use case
  ansible.builtin.include_vars:
    file: "{{ usecase_scratch.path }}/env_variables.yml"
  no_log: true
