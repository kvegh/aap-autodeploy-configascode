---
# Take a cold libvirt snapshot of the AAP VM on the hypervisor: shut the VM
# down, snapshot it, start it again and wait until it accepts SSH logins.
# Imported twice by 11-aap-install.yml, before and after the AAP install.
# A rerun finds an existing snapshot and leaves the VM running.
#
# Required variables:
#   aap_vm_snapshot          snapshot name, one of aap_vm_snapshot_names
#   aap_vm_name              VM name, also its AAP inventory host
#   aap_vm_shutdown_timeout  seconds the guest may take to power off

# community.libvirt has no snapshot module. libvirt keeps each snapshot's
# metadata in this file as long as the snapshot exists.
- name: Look for the snapshot's metadata
  ansible.builtin.stat:
    path: "/var/lib/libvirt/qemu/snapshot/{{ aap_vm_name }}/{{ aap_vm_snapshot }}.xml"
  register: aap_vm_snapshot_metadata

- name: Take the snapshot unless it exists
  when: not aap_vm_snapshot_metadata.stat.exists
  block:
    - name: Shut the AAP VM down
      community.libvirt.virt:
        name: "{{ aap_vm_name }}"
        state: shutdown

    # libvirt reports "shutdown" already while the guest is still stopping;
    # its QEMU process (and pid file) is gone only once the VM is off.
    - name: Wait until the AAP VM is off
      ansible.builtin.wait_for:
        path: "/run/libvirt/qemu/{{ aap_vm_name }}.pid"
        state: absent
        timeout: "{{ aap_vm_shutdown_timeout }}"

    - name: Take the snapshot of the stopped AAP VM
      ansible.builtin.command:
        argv: [virsh, snapshot-create-as, --domain, "{{ aap_vm_name }}", --name, "{{ aap_vm_snapshot }}"]
      changed_when: true

    - name: Start the AAP VM
      community.libvirt.virt:
        name: "{{ aap_vm_name }}"
        state: running

    - name: Wait until the AAP VM accepts SSH logins through the hypervisor
      ansible.builtin.wait_for_connection:
      delegate_to: "{{ aap_vm_name }}"
