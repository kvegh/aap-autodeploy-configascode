---
# Take a cold libvirt snapshot of a VM on the hypervisor: shut the VM down,
# snapshot it, start it again and wait until it accepts SSH logins. Imported
# by 40-aap-vm-os-config.yml (before the AAP install) and 52-aap-install.yml
# (after it).
# A rerun finds an existing snapshot and leaves the VM running.
#
# Required variables:
#   vm_snapshot          snapshot name, one of vm_snapshot_names
#   vm_name              VM name, also its AAP inventory host
#   vm_shutdown_timeout  seconds the guest may take to power off

# community.libvirt has no snapshot module. libvirt keeps each snapshot's
# metadata in this file as long as the snapshot exists.
- name: Look for the snapshot's metadata
  ansible.builtin.stat:
    path: "/var/lib/libvirt/qemu/snapshot/{{ vm_name }}/{{ vm_snapshot }}.xml"
  register: vm_snapshot_metadata

- name: Take the snapshot unless it exists
  when: not vm_snapshot_metadata.stat.exists
  block:
    - name: Shut the VM down
      community.libvirt.virt:
        name: "{{ vm_name }}"
        state: shutdown

    # libvirt reports "shutdown" already while the guest is still stopping;
    # its QEMU process (and pid file) is gone only once the VM is off.
    - name: Wait until the VM is off
      ansible.builtin.wait_for:
        path: "/run/libvirt/qemu/{{ vm_name }}.pid"
        state: absent
        timeout: "{{ vm_shutdown_timeout }}"

    - name: Take the snapshot of the stopped VM
      ansible.builtin.command:
        argv: [virsh, snapshot-create-as, --domain, "{{ vm_name }}", --name, "{{ vm_snapshot }}"]
      changed_when: true

    - name: Start the VM
      community.libvirt.virt:
        name: "{{ vm_name }}"
        state: running

    - name: Wait until the VM accepts SSH logins through the hypervisor
      ansible.builtin.wait_for_connection:
      delegate_to: "{{ vm_name }}"
