---
# Create the AAP VM of a deployment version on the hypervisor.
#
# The disk is a copy of the golden image (downloaded and checked by the image
# download stage) in the vms pool, grown to the configured size. Its
# filesystem is grown later, in the VM OS configuration stage. Before the first
# boot, libguestfs (virt-customize) prepares the copy offline: the FQDN as
# host name, the automation account with exactly its declared keys and its
# sudo rule (as the host access bootstrap sets them on the hypervisor), an
# empty machine-id and no Red Hat registration left from the image, and a
# SELinux relabel for the files it wrote. No cloud-init. SSH host keys are
# not touched: host key checking is off, as for the hypervisor.
#
# The VM gets a fixed MAC from the internal network's DHCP reservation, so its
# address is known before it exists, and starts with the host. Its RHEL 9 OS
# type gives it virtio disk and network devices.
#
# The VM is recorded as a host of the AAP inventory, named like the VM, with
# its connection values from the CaC: the reserved address, the FQDN, and SSH
# through the hypervisor as jump host. This run reaches it with the same
# values and proves login and sudo.
#
# Rerunnable: once the VM is defined, the disk is neither resized nor
# customized again and the VM is left as it is. A run that failed before the
# VM was defined repeats the preparation on the same copy.
#
# Runs as the automation account on the port the host access bootstrap
# recorded in the AAP inventory. The machine credential logs in on both hops,
# the hypervisor and the VM. The standard Red Hat Ansible Automation Platform
# credential hands the controller URL and login to ansible.controller as
# environment variables.
#
# Required variables, from the CaC inventory unless noted:
#   autodeploy_deployment_version   from the deployment version stage, for example v29
#   vm_name                VM and short host name, for example aap27-v29
#   vm_fqdn                host name set in the VM, for example aap27.v29.example.com
#   vm_base_image          golden image on the hypervisor
#   vm_disk_path           VM disk in the vms pool
#   vm_disk_size           disk size as qemu-img takes it, for example 60G
#   vm_vcpus               virtual CPUs
#   vm_memory_mib          memory in MiB
#   vm_osinfo              libosinfo name of the guest OS
#   vm_network             libvirt network
#   vm_mac                 MAC of the network's DHCP reservation for the VM
#   vm_autostart           start the VM with the host
#   vm_connection          host variables of the VM: ansible_host, ansible_fqdn,
#                          ansible_ssh_common_args (jump through the hypervisor)
#   aap_inventory_name     AAP inventory the VM is recorded in
#   host_automation_user   automation account, the user of the AAP machine credential
#   host_authorized_keys   dict user name -> list of public keys
#   host_automation_sudo_rule  sudoers rule of the automation account

- name: Create the AAP VM
  hosts: autodeploy_target
  become: true
  gather_facts: false
  vars:
    # libvirt keeps the definition of every system VM here; the disk steps
    # below must never touch the disk of a defined, possibly running VM.
    vm_definition: "/etc/libvirt/qemu/{{ vm_name }}.xml"
  tasks:
    - name: Copy the golden image into the VM pool
      ansible.builtin.copy:
        src: "{{ vm_base_image }}"
        dest: "{{ vm_disk_path }}"
        remote_src: true
        force: false
        mode: preserve

    # No module resizes a disk image file without its volume XML.
    - name: Grow the VM disk to its configured size
      ansible.builtin.command:
        argv: [qemu-img, resize, "{{ vm_disk_path }}", "{{ vm_disk_size }}"]
        creates: "{{ vm_definition }}"

    # No module edits a disk image offline; virt-customize is libguestfs' tool.
    - name: Prepare the VM disk for its first boot
      ansible.builtin.command:
        argv:
          - virt-customize
          - --add
          - "{{ vm_disk_path }}"
          - --no-network
          - --hostname
          - "{{ vm_fqdn }}"
          - --run-command
          - "id {{ host_automation_user }} || useradd {{ host_automation_user }}"
          - --run-command
          - "rm -f ~{{ host_automation_user }}/.ssh/authorized_keys"
          - --ssh-inject
          - "{{ host_automation_user }}:string:{{ host_authorized_keys[host_automation_user] | join('\n') }}"
          - --write
          - "/etc/sudoers.d/{{ host_automation_user }}:# Managed by aap-autodeploy-configascode\n{{ host_automation_sudo_rule }}\n"
          - --chmod
          - "0440:/etc/sudoers.d/{{ host_automation_user }}"
          - --truncate
          - /etc/machine-id
          - --run-command
          - subscription-manager clean
          - --selinux-relabel
        creates: "{{ vm_definition }}"

    - name: Create and start the AAP VM
      community.libvirt.virt_install:
        name: "{{ vm_name }}"
        import: true
        osinfo:
          name: "{{ vm_osinfo }}"
        vcpus: "{{ vm_vcpus }}"
        memory: "{{ vm_memory_mib }}"
        disks:
          - path: "{{ vm_disk_path }}"
            format: qcow2
        networks:
          - network: "{{ vm_network }}"
            mac:
              address: "{{ vm_mac }}"
        autostart: "{{ vm_autostart }}"

    - name: Record the AAP VM in the AAP inventory
      ansible.controller.host:
        name: "{{ vm_name }}"
        inventory: "{{ aap_inventory_name }}"
        variables: "{{ vm_connection }}"
      delegate_to: localhost
      become: false

    # The recorded host is in AAP, not in this run's inventory.
    - name: Add the AAP VM to this run with the recorded connection values
      ansible.builtin.add_host:
        name: "{{ vm_name }}"
        ansible_host: "{{ vm_connection.ansible_host }}"
        ansible_fqdn: "{{ vm_connection.ansible_fqdn }}"
        ansible_ssh_common_args: "{{ vm_connection.ansible_ssh_common_args }}"

    - name: Wait until the AAP VM accepts SSH logins through the hypervisor
      ansible.builtin.wait_for_connection:
      delegate_to: "{{ vm_name }}"

    - name: Prove login and sudo on the AAP VM
      ansible.builtin.ping:
      delegate_to: "{{ vm_name }}"
      become: true
