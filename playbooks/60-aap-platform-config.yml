---
# Give a freshly installed AAP its platform configuration, through its public
# URL (Let's Encrypt certificate on the hypervisor's nginx), logged in as the
# installer's admin.
#
# Order: create this AAP's two Gateway tokens (its own hub, MCP clients) and
# store them in the private repository's vault, both only when the vault has
# none for this AAP yet; attach the subscription with a Red Hat service
# account; apply the platform CaC tree of the private repository with the
# Community of Practice (CoP) collections: what changes AAP itself, namely
# organization Default with the Galaxy credentials of this AAP's own hub (with
# its hub token), the hub collection remotes and the deploying AAP's EE
# registry. The base content (70-aap-base-content-config.yml) follows, reads
# the tokens from the vault and syncs from these sources.
#
# The tree may not live under usecases/: the CaC apply job would apply it to
# the deploying AAP. The download stays in the execution environment's
# scratch directory, which goes away with the job.
#
# Rerunnable: tokens are created once per AAP (the vault entry is the record);
# the rest converges. Retiring an instance removes its vault entry.
#
# Credentials: GitHub AutoDeploy CaC Secrets-NGNG (counter_git_username,
# counter_git_token; read and write) and the vault credential of the private
# repository. No AAP credential: every task logs in to the new AAP.
#
# Required variables, from the job template, the workflow or the CaC inventory:
#   autodeploy_deployment_version   deployment version, for example v29
#   cac_repository, cac_repository_ref, cac_usecase
#                                   private repository, ref (also the branch
#                                   the vault is written to) and use case whose
#                                   env_variables.yml is the vault file
#   aap_config_cac_dir              AAP config tree (part 6) in the private repository
#   vm_name, vm_fqdn                AAP VM name (the vault key) and AAP name
#   aap_base_user                   login and token owner; its password is the
#                                   installer's admin password
# From the vault (env_variables.yml): vaulted_aap_installer
# (gateway_admin_password), vaulted_redhat_subscription_client_id and
# _secret, vaulted_cac_vault_password (to write the vault), the secrets the
# tree refers to, and vaulted_aap_instance_tokens (written here: per AAP VM
# name, hub and mcp).
# Given to the tree: aap_base_tokens (hub), cac_scratch (the download).

- name: Configure the platform of the new AAP
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    aap_hostname: "https://{{ vm_fqdn }}"
    aap_username: "{{ aap_base_user }}"
    aap_password: "{{ vaulted_aap_installer.gateway_admin_password }}"
    aap_validate_certs: true
    # The token module also sets the fact aap_token, which the CoP roles would
    # take as their login. This play variable outranks the fact and keeps the
    # password login.
    aap_token: ""
    aap_configuration_secure_logging: true
    aap_configuration_async_dir: /tmp/.ansible_async  # empty default broke async_status ("could not find job") on ansible-core 2.20
    controller_configuration_filetree_read_layout: create
    dir_orgs_vars: "{{ cac_scratch.path }}/{{ aap_config_cac_dir }}"
    redhat_subscription_client_id: "{{ vaulted_redhat_subscription_client_id }}"
    redhat_subscription_client_secret: "{{ vaulted_redhat_subscription_client_secret }}"
    aap_platform_vault_path: "usecases/{{ cac_usecase }}/env_variables.yml"
    aap_base_tokens: >-
      {{ {'hub': aap_platform_hub_token.token, 'mcp': aap_platform_mcp_token.token}
         if aap_platform_hub_token is changed
         else vaulted_aap_instance_tokens[vm_name] }}
  module_defaults:
    group/ansible.controller.controller: &aap_login
      aap_hostname: "{{ aap_hostname }}"
      aap_username: "{{ aap_username }}"
      aap_password: "{{ aap_password }}"
      aap_validate_certs: "{{ aap_validate_certs }}"
    # Without it, ansible.platform's action plugins read the login from the
    # raw, untemplated play variables.
    group/ansible.platform.gateway: *aap_login
  tasks:
    - name: Download the private repository
      ansible.builtin.import_tasks: tasks/private-repository-download.yml

    - name: Load the vault values
      ansible.builtin.include_vars:
        file: "{{ cac_scratch.path }}/{{ aap_platform_vault_path }}"
      no_log: true

    - name: Create this AAP's tokens and store them in the vault
      when: vm_name not in vaulted_aap_instance_tokens | default({})
      block:
        - name: Create the Gateway token for this AAP's own hub
          ansible.platform.token:
            description: Galaxy and registry credentials for this AAP's own hub
            scope: read
          register: aap_platform_hub_token
          no_log: true

        - name: Create the Gateway token for MCP clients
          ansible.platform.token:
            description: MCP clients
            scope: write
          register: aap_platform_mcp_token
          no_log: true

        - name: Read the vault file and its blob SHA
          ansible.builtin.uri:
            url: "https://api.github.com/repos/{{ cac_repository }}/contents/{{ aap_platform_vault_path }}?ref={{ cac_repository_ref }}"
            url_username: "{{ counter_git_username }}"
            url_password: "{{ counter_git_token }}"
            force_basic_auth: true
            headers:
              Accept: application/vnd.github+json
              X-GitHub-Api-Version: "2022-11-28"
            timeout: 30
          register: aap_platform_vault_file
          no_log: true

        # Decrypted with the vault password from the vault itself, the key of
        # this AAP added, encrypted again. Comments in the file are lost; the
        # blob SHA makes GitHub reject the write if the file changed meanwhile.
        - name: Write the tokens into the vault file
          ansible.builtin.uri:
            url: "https://api.github.com/repos/{{ cac_repository }}/contents/{{ aap_platform_vault_path }}"
            method: PUT
            url_username: "{{ counter_git_username }}"
            url_password: "{{ counter_git_token }}"
            force_basic_auth: true
            headers:
              Accept: application/vnd.github+json
              X-GitHub-Api-Version: "2022-11-28"
            body_format: json
            body:
              message: "Store the tokens of {{ vm_name }}"
              branch: "{{ cac_repository_ref }}"
              sha: "{{ aap_platform_vault_file.json.sha }}"
              content: >-
                {{ aap_platform_vault_file.json.content | b64decode
                | ansible.builtin.unvault(vaulted_cac_vault_password, vault_id='cac')
                | from_yaml
                | combine({'vaulted_aap_instance_tokens': {vm_name: aap_base_tokens}}, recursive=true)
                | to_nice_yaml
                | ansible.builtin.vault(vaulted_cac_vault_password, vault_id='cac')
                | b64encode }}
            timeout: 30
          changed_when: true
          no_log: true

    - name: Load the subscription settings of the platform tree
      ansible.builtin.include_vars:
        file: "{{ dir_orgs_vars }}/controller_license.yaml"

    - name: Attach the AAP subscription
      ansible.builtin.include_role:
        name: infra.aap_configuration.controller_license

    - name: Read the platform tree
      ansible.builtin.include_role:
        name: infra.aap_configuration_extended.filetree_read

    - name: Apply the platform tree
      ansible.builtin.include_role:
        name: infra.aap_configuration.dispatch
