---
# Choose the SSH port and user for this run.
#
# The inventory always holds the final state: the managed SSH port and the
# admin user. A freshly reinstalled host has neither yet; it answers only on
# port 22 as root. This play checks from the execution environment whether the
# managed port answers. If it does not, the host has not been through the SSH
# stage yet, and this run uses port 22 as the bootstrap user instead.
#
# Imported first by every playbook that can run before the SSH stage has
# proven the managed port (conversion, update, host setup). Nothing is passed
# between workflow nodes; each run decides for itself.
#
# Required variables (inventory, vault):
#   host_ssh_port         managed SSH port (private, from the vault)
#   host_bootstrap_user   user of the fresh installation, normally root

- name: Choose the SSH port and user for this run
  hosts: autodeploy_target
  gather_facts: false
  tasks:
    - name: Check whether the managed SSH port answers
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ host_ssh_port | int }}"
        timeout: 5
      delegate_to: localhost
      register: host_connect_probe
      ignore_errors: true

    - name: Use the bootstrap port and user before the SSH stage has run
      ansible.builtin.set_fact:
        ansible_port: 22
        ansible_user: "{{ host_bootstrap_user }}"
      when: host_connect_probe is failed
