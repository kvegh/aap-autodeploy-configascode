---
# Create the ansible and personal accounts, turn off root login and move SSH
# to the managed port, minutes after the reinstall.
#
# The host is exposed to the internet from the moment the provider has
# installed it, with root login by key on port 22. The previous implementation
# ran as root through most of its run. This stage runs first: it creates
# ansible, the user of the AAP machine credential, proves its login and sudo,
# and only then turns off root, password and keyboard-interactive login. Every
# later stage runs as ansible on the managed port.
#
# ansible gets passwordless sudo: it logs in by key only, so a sudo password
# would add little and would have to be stored and injected as one more secret.
# The personal accounts (host_users) are created here too, with their keys;
# admins are members of wheel, which gets passwordless sudo for the same
# reason. AllowUsers is part of the SSH settings from the first change on, so
# the login proof on the managed port runs with it in force.
#
# All SSH configuration of the hypervisor lives here. The move to the managed
# port happens still on Rocky Linux, so the conversion, update and setup
# stages already run on it. The conversion is in place and keeps the setting.
# sshd first listens on the public address on port 22 and on the managed port;
# the run switches to the managed port, proves login plus sudo and records the
# port in the AAP inventory for later jobs. Only after that does sshd drop the
# public port 22 and the firewall close it on the public zone. If the proof
# fails, port 22 still works and the host can be fixed without a reinstall.
#
# sshd also listens on the internal libvirt bridge address on port 22, where
# the VMs reach the hypervisor. The bridge only appears when the host setup
# creates the libvirt network, and at boot sshd may start before the public
# address or the bridge is up, so net.ipv4.ip_nonlocal_bind is set first and
# sshd binds both addresses regardless. The bridge goes into firewalld's
# libvirt zone, which allows ssh; the public zone never opens port 22 for it.
#
# SELinux enforces on the provider's Rocky Linux, so the sshd role labels the
# managed port ssh_port_t before sshd binds it. firewalld may be missing or
# stopped on the provider's image; the firewall role installs, enables and
# starts it, with the managed port open to everyone (the user logs in from
# changing addresses; key-only login and fail2ban protect it). Its default
# public zone keeps the ssh service open until the proof.
#
# Required inventory: the host in group autodeploy_target. The reinstall stage
# removes ansible_port from the AAP inventory host, so a fresh host is reached
# on port 22.
#
# The machine credential's SSH key must be one of the keys the reinstall stage
# installed for root (robot_ssh_keys) and one of the keys listed for ansible.
#
# Required variables, all from the CaC inventory:
#   host_authorized_keys   dict user name -> list of public keys, for
#                          ansible and every account in host_users
#   host_users             personal accounts, list of {name, groups};
#                          admins include wheel
#   host_ssh_allow_users   accounts allowed to log in: ansible and the
#                          accounts in host_users
#   host_ssh_port          managed SSH port
#   dns_host_ipv4          public IPv4 of the host, as for the host DNS stage
#   net_internal           the internal network; its address is the bridge's
#   host_ssh_internal_port port sshd listens on at the bridge address
#   host_sshd_config_file  sshd drop-in file the sshd role writes as a whole
#   host_sshd_hardening    sshd settings, for example PermitRootLogin; Port,
#                          ListenAddress and AllowUsers are added here
#   aap_inventory_name     AAP inventory that holds this host under its inventory name
#   host_bootstrap_user    login of the fresh installation, root. Set it to
#                          ansible to rerun this stage once root login is off;
#                          a rerun connects on the recorded port.
#
# Credentials: the machine credential, and the standard Red Hat Ansible
# Automation Platform credential, which hands the controller URL and login to
# ansible.controller as environment variables.

- name: Create the accounts, turn off root login and move SSH to the managed port
  hosts: autodeploy_target
  become: true
  # The machine credential logs in as ansible, which does not exist yet on a
  # fresh installation. Play variables override the credential's user, so this
  # play alone starts as root; the tasks below switch it to ansible.
  vars:
    ansible_user: "{{ host_bootstrap_user }}"
    host_sshd_bootstrap_settings: >-
      {{ host_sshd_hardening | combine({'Port': host_ssh_port | int,
      'AllowUsers': host_ssh_allow_users | join(' ')}) }}
    host_sshd_final_listen: ["{{ dns_host_ipv4 }}:{{ host_ssh_port }}", "{{ net_internal.address }}:{{ host_ssh_internal_port }}"]
  tasks:
    - name: Create the ansible user
      ansible.builtin.user:
        name: ansible
        state: present

    - name: Allow exactly the declared SSH keys for ansible
      ansible.posix.authorized_key:
        user: ansible
        key: "{{ host_authorized_keys['ansible'] | join('\n') }}"
        exclusive: true
        state: present

    - name: Allow passwordless sudo for ansible
      ansible.builtin.copy:
        dest: /etc/sudoers.d/ansible
        owner: root
        group: root
        mode: "0440"
        content: |
          # Managed by aap-autodeploy-configascode
          ansible ALL=(ALL) NOPASSWD: ALL
        validate: /usr/sbin/visudo -cf %s

    - name: Create the personal accounts with exact groups
      ansible.builtin.user:
        name: "{{ item.name }}"
        groups: "{{ item.groups | default([]) }}"
        append: false
        state: present
      loop: "{{ host_users }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Allow exactly the declared SSH keys for the personal accounts
      ansible.posix.authorized_key:
        user: "{{ item.name }}"
        key: "{{ host_authorized_keys[item.name] | join('\n') }}"
        exclusive: true
        state: present
      loop: "{{ host_users }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Allow passwordless sudo for wheel
      ansible.builtin.copy:
        dest: /etc/sudoers.d/wheel-nopasswd
        owner: root
        group: root
        mode: "0440"
        content: |
          # Managed by aap-autodeploy-configascode
          %wheel ALL=(ALL) NOPASSWD: ALL
        validate: /usr/sbin/visudo -cf %s

    - name: Switch this run to ansible
      ansible.builtin.set_fact:
        ansible_user: ansible

    - name: Reconnect as ansible
      ansible.builtin.meta: reset_connection

    # Root login is turned off next; without this proof the host could be
    # left with no working login.
    - name: Prove the ansible login and sudo
      ansible.builtin.ping:

    - name: Run firewalld with the managed SSH port open
      ansible.builtin.include_role:
        name: redhat.rhel_system_roles.firewall
      vars:
        firewall:
          - zone: public
            interface: "{{ ansible_facts['default_ipv4']['interface'] }}"
            state: enabled
            permanent: true
            runtime: true
          - zone: public
            port: "{{ host_ssh_port }}/tcp"
            state: enabled
            permanent: true
            runtime: true

    # sshd binds the public and bridge addresses even when they are not up
    # yet: at boot, and the bridge until the host setup creates it.
    - name: Let sshd bind addresses that are not up yet
      ansible.posix.sysctl:
        name: net.ipv4.ip_nonlocal_bind
        value: "1"
        sysctl_file: /etc/sysctl.d/80-sshd-nonlocal-bind.conf
        sysctl_set: true
        reload: true

    # Port is only read by the role to label the managed port ssh_port_t in
    # SELinux; each ListenAddress carries its own port.
    - name: Turn off root and password login, allow the declared accounts, add the managed port
      ansible.builtin.include_role:
        name: redhat.rhel_system_roles.sshd
      vars:
        sshd_config_file: "{{ host_sshd_config_file }}"
        sshd_manage_selinux: true
        sshd_config: >-
          {{ host_sshd_bootstrap_settings | combine({'ListenAddress':
          [dns_host_ipv4 ~ ':22'] + host_sshd_final_listen}) }}

    - name: Apply the transitional SSH configuration now
      ansible.builtin.meta: flush_handlers

    - name: Switch this run to the managed port
      ansible.builtin.set_fact:
        ansible_port: "{{ host_ssh_port | int }}"

    - name: Reconnect on the managed port
      ansible.builtin.meta: reset_connection

    - name: Prove login and sudo on the managed port
      ansible.builtin.ping:

    # Later jobs read the port from the inventory instead of probing for it.
    # The current host variables are read and merged, so nothing else is lost.
    # The reinstall stage removes the port again.
    - name: Record the managed port in the AAP inventory
      ansible.controller.host:
        name: "{{ inventory_hostname }}"
        inventory: "{{ aap_inventory_name }}"
        variables: "{{ aap_host_variables | combine({'ansible_port': host_ssh_port | int}) }}"
      vars:
        aap_host_variables: >-
          {{ (lookup('ansible.controller.controller_api', 'hosts', expect_one=true,
          query_params={'name': inventory_hostname, 'inventory__name': aap_inventory_name}).variables
          | from_yaml) | default({}, true) }}
      delegate_to: localhost
      become: false

    - name: Listen on the public managed port and the bridge only
      ansible.builtin.include_role:
        name: redhat.rhel_system_roles.sshd
      vars:
        sshd_config_file: "{{ host_sshd_config_file }}"
        sshd_manage_selinux: true
        sshd_config: "{{ host_sshd_bootstrap_settings | combine({'ListenAddress': host_sshd_final_listen}) }}"

    - name: Apply the final SSH configuration now
      ansible.builtin.meta: flush_handlers

    - name: Close port 22 on the public zone
      ansible.posix.firewalld:
        service: ssh
        zone: public
        state: disabled
        permanent: true
        immediate: true
