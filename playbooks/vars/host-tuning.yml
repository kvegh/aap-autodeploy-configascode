---
# Kernel values the tuning stage sets and the post-reboot check reads back.
# One definition, so the setup and the check cannot drift apart.

# Written to /etc/sysctl.d/90-hypervisor-vm.conf. Byte-based write limits
# (2026-10-29 incident) and little swapping.
host_tuning_sysctls:
  - {name: vm.dirty_background_bytes, value: "67108864"}
  - {name: vm.dirty_bytes, value: "268435456"}
  - {name: vm.swappiness, value: "10"}

# Written at every boot by /etc/tmpfiles.d/ksm.conf.
host_ksm_settings:
  - {path: /sys/kernel/mm/ksm/run, value: "1"}
  - {path: /sys/kernel/mm/ksm/pages_to_scan, value: "1000"}
  - {path: /sys/kernel/mm/ksm/sleep_millisecs, value: "100"}
