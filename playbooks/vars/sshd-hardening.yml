---
# SSH settings of the host access bootstrap, which writes the drop-in file
# (the sshd role replaces it as a whole). AllowUsers needs
# host_ssh_allow_users.
host_sshd_config_file: /etc/ssh/sshd_config.d/10-hypervisor.conf
host_sshd_hardening:
  PermitRootLogin: "no"
  PasswordAuthentication: "no"
  KbdInteractiveAuthentication: "no"
  PubkeyAuthentication: "yes"
  AllowUsers: "{{ host_ssh_allow_users | join(' ') }}"
