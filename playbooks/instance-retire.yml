---
# Retire deployment instances named by hand, for example "v24, v25".
#
# Not part of any deployment workflow: several instances may be live at the
# same time, and only a person decides which one is finished. Its own job
# template, started by hand with the versions in the survey.
#
# Everything an instance owns is found by the version in its name; there is no
# separate registry. This version cleans six things:
#   1. the AAP VM's snapshots and the VM on the hypervisor (stopped and
#      undefined; removing it also deletes its disk from the pool)
#   2. the AAP vhost and the Let's Encrypt certificate of the AAP name on the
#      hypervisor
#   3. every host in the AAP inventory with the version as a whole part of
#      its name, for example aap27-v24
#   4. every A record in the zone with the version as a whole label, for
#      example host.v24 and aap.v24, but never host.v240
#   5. the AAP VM's Gateway tokens in the private repository's vault; the
#      tokens themselves go with the destroyed AAP, so they are not revoked
#   6. the version in the live list of the deployment counter
# The live list is written last, so a failure leaves the version live and a
# rerun finds everything again.
#
# Extension rule: every later stage that creates something per instance (VMs,
# vhosts, certificates, AAP inventory entries, generated secrets, monitoring)
# adds its own cleanup step here when it is built. Removing the Red Hat
# registration is a planned follow-up; it needs a Red Hat API token.
#
# Required variables, supplied by the job template, its survey, the CaC
# inventory, the Git write credential, the DNS credential and the machine
# credential of the hypervisor, the vault credential of the private
# repository, and the standard Red Hat Ansible Automation
# Platform credential, which hands the controller URL and token to the
# ansible.controller lookup as environment variables and to the play as
# aap_hostname and aap_token:
#   retire_versions        survey text, versions separated by commas or spaces
#   counter_repository     private repository as owner/name
#   counter_file_path      counter file in that repository, from the CaC inventory
#   counter_git_username   GitHub account that owns the token
#   counter_git_token      token with contents write access to that repository
#   cac_repository, cac_repository_ref, cac_usecase
#                          private repository, ref (also the branch the vault
#                          is written to) and use case whose env_variables.yml
#                          is the vault file
#   dns_godaddy_token      GoDaddy API token for the zone
#   dns_zone               DNS zone, for example example.com
#   vm_name            AAP VM name, a template on autodeploy_deployment_version
#   vm_fqdn            AAP name, the name of its certificate and vhost
#   vm_snapshot_names  dict of the AAP VM's snapshot names
#   aap_inventory_name     AAP inventory the VM's host is recorded in
# From the vault: vaulted_cac_vault_password (to write the vault) and
# vaulted_aap_instance_tokens (per AAP VM name).

- name: Check the deployment versions to retire
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    counter_api_url: "https://api.github.com/repos/{{ counter_repository }}/contents/{{ counter_file_path }}"
    counter_live_pattern: '(?m)^autodeploy_deployment_instances_live: \[[0-9, ]*\]$'
  tasks:
    - name: Read the counter file and its blob SHA
      ansible.builtin.uri:
        url: "{{ counter_api_url }}"
        method: GET
        url_username: "{{ counter_git_username }}"
        url_password: "{{ counter_git_token }}"
        force_basic_auth: true
        headers:
          Accept: application/vnd.github+json
          X-GitHub-Api-Version: "2022-11-28"
        return_content: true
        status_code: 200
        timeout: 30
      register: retire_counter_file
      check_mode: false
      no_log: true

    - name: Normalise the versions to retire
      ansible.builtin.set_fact:
        counter_text: "{{ retire_counter_file.json.content | b64decode }}"
        counter_number: "{{ (retire_counter_file.json.content | b64decode | from_yaml).autodeploy_deployment_counter_next }}"
        counter_live: "{{ (retire_counter_file.json.content | b64decode | from_yaml).autodeploy_deployment_instances_live }}"
        retire_labels: "{{ retire_tokens | map('regex_replace', '^v?', 'v') | unique | list }}"
        retire_numbers: "{{ retire_tokens | map('regex_replace', '^v?', '') | map('int') | unique | list }}"
      vars:
        retire_tokens: "{{ retire_versions | lower | regex_replace('[,\\s]+', ' ') | trim | split(' ') }}"

    # The live line check makes sure the write below changes exactly that line.
    - name: Require two-digit versions that are all live
      ansible.builtin.assert:
        that:
          - retire_labels | reject('match', '^v[0-9]{2}$') | list | length == 0
          - retire_numbers | length > 0
          - retire_numbers | difference(counter_live | map('int')) | length == 0
          - counter_number | int not in retire_numbers
          - counter_text is ansible.builtin.regex(counter_live_pattern)
        fail_msg: >-
          Give live versions as vXY, separated by commas or spaces. Live now:
          {{ counter_live | join(', ') }}. Nothing was changed.

# A failure here must stop the whole run before DNS and the live list change.
- name: Remove the AAP VMs, vhosts and certificates of the retired versions
  hosts: autodeploy_target
  become: true
  gather_facts: false
  any_errors_fatal: true
  handlers:
    - name: Reload nginx
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded
  tasks:
    # libvirt refuses to undefine a VM that still has snapshots.
    # community.libvirt has no snapshot module; the metadata file exists
    # as long as the snapshot does.
    - name: Delete the AAP VM's snapshots
      ansible.builtin.command:
        argv: [virsh, snapshot-delete, --domain, "{{ vm_name }}", --snapshotname, "{{ item.1 }}"]
        removes: "/var/lib/libvirt/qemu/snapshot/{{ vm_name }}/{{ item.1 }}.xml"
      loop: "{{ hostvars['localhost'].retire_labels | product(vm_snapshot_names.values()) | list }}"
      vars:
        autodeploy_deployment_version: "{{ item.0 }}"

    # The CaC names are templates on the deployment version; each item sets it.
    - name: Stop and undefine the AAP VM
      community.libvirt.virt_install:
        name: "{{ vm_name }}"
        state: absent
      loop: "{{ hostvars['localhost'].retire_labels }}"
      vars:
        autodeploy_deployment_version: "{{ item }}"

    - name: Remove the AAP vhost
      ansible.builtin.file:
        path: "/etc/nginx/conf.d/{{ vm_fqdn }}.conf"
        state: absent
      loop: "{{ hostvars['localhost'].retire_labels }}"
      vars:
        autodeploy_deployment_version: "{{ item }}"
      notify: Reload nginx

    # certbot keeps a certificate in three directories plus its renewal
    # configuration; its own delete removes all of them.
    - name: Delete the certificate of the AAP name
      ansible.builtin.command:
        argv: [certbot, delete, --cert-name, "{{ vm_fqdn }}", --non-interactive]
        removes: "/etc/letsencrypt/live/{{ vm_fqdn }}"
      loop: "{{ hostvars['localhost'].retire_labels }}"
      vars:
        autodeploy_deployment_version: "{{ item }}"

- name: Remove the inventory hosts, DNS names, vault tokens and live list entries of the retired versions
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    counter_api_url: "https://api.github.com/repos/{{ counter_repository }}/contents/{{ counter_file_path }}"
    counter_live_pattern: '(?m)^autodeploy_deployment_instances_live: \[[0-9, ]*\]$'
    dns_api_base: https://api.godaddy.com
    retire_vault_path: "usecases/{{ cac_usecase }}/env_variables.yml"
    # Vault keys are AAP VM names; the version is a whole part of the name.
    retire_token_names: >-
      {{ vaulted_aap_instance_tokens | default({}) | dict2items | map(attribute='key')
      | select('search', '(?i)(^|[.-])(' ~ retire_labels | join('|') ~ ')([.-]|$)') | list }}
  tasks:
    # Before DNS and the live list, so a failure leaves the version live.
    # AAP refuses to delete a host while a job runs on its inventory, and this
    # job does. Removing it from the inventory's host list deletes it without
    # that check (documented API of the inventory's hosts list).
    - name: Remove the AAP VMs' hosts from the AAP inventory
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/controller/v2/inventories/{{ item.inventory }}/hosts/"
        method: POST
        headers:
          Authorization: "Bearer {{ aap_token }}"
        body_format: json
        body:
          id: "{{ item.id }}"
          disassociate: true
        status_code: 204
        timeout: 30
      loop: >-
        {{ query('ansible.controller.controller_api', 'hosts',
                 query_params={'inventory__name': aap_inventory_name,
                               'name__iregex': '(^|[.-])(' ~ retire_labels | join('|') ~ ')([.-]|$)'}) }}
      loop_control:
        label: "{{ item.name }}"
      changed_when: true
      no_log: true

    # A partial list would let names survive while the version leaves the live
    # list, and no rerun would find them again.
    - name: Read all A records of the zone
      ansible.builtin.uri:
        url: >-
          {{ dns_api_base }}/v3/domains/zones/{{ dns_zone | urlencode }}/dns-records?type=A&page=1&pageSize=100&totalRequired=true
        method: GET
        headers:
          Authorization: "Bearer {{ dns_godaddy_token }}"
        return_content: true
        status_code: 200
        timeout: 30
      register: retire_dns_records
      failed_when: >-
        retire_dns_records.status != 200
        or retire_dns_records.json.totalPages | default(1) | int > 1
      check_mode: false
      no_log: true

    # DNS first, list second: a failed delete leaves the version live, so a
    # rerun finds its names again. Versions without a record are fine.
    - name: Delete every A record named after a retired version
      ansible.builtin.uri:
        url: "{{ dns_api_base }}/v3/domains/zones/{{ dns_zone | urlencode }}/dns-records/{{ item.recordId | urlencode }}"
        method: DELETE
        headers:
          Authorization: "Bearer {{ dns_godaddy_token }}"
        status_code: 204
        timeout: 30
      loop: >-
        {{ retire_dns_records.json['items']
        | selectattr('name', 'search', '(?i)(^|[.])(' ~ retire_labels | join('|') ~ ')([.]|$)') | list }}
      loop_control:
        label: "{{ item.name }}"
      changed_when: true
      no_log: true

    - name: Download the private repository
      ansible.builtin.import_tasks: tasks/private-repository-download.yml

    - name: Load the vault values
      ansible.builtin.include_vars:
        file: "{{ cac_scratch.path }}/{{ retire_vault_path }}"
      no_log: true

    - name: Remove the retired AAPs' tokens from the vault
      when: retire_token_names | length > 0
      block:
        - name: Read the vault file and its blob SHA
          ansible.builtin.uri:
            url: "https://api.github.com/repos/{{ cac_repository }}/contents/{{ retire_vault_path }}?ref={{ cac_repository_ref }}"
            url_username: "{{ counter_git_username }}"
            url_password: "{{ counter_git_token }}"
            force_basic_auth: true
            headers:
              Accept: application/vnd.github+json
              X-GitHub-Api-Version: "2022-11-28"
            timeout: 30
          register: retire_vault_file
          no_log: true

        # Same rewrite as the base configuration job's token write: decrypt,
        # replace the token dict, encrypt again; comments in the file are lost.
        - name: Write the vault file without their tokens against the read blob SHA
          ansible.builtin.uri:
            url: "https://api.github.com/repos/{{ cac_repository }}/contents/{{ retire_vault_path }}"
            method: PUT
            url_username: "{{ counter_git_username }}"
            url_password: "{{ counter_git_token }}"
            force_basic_auth: true
            headers:
              Accept: application/vnd.github+json
              X-GitHub-Api-Version: "2022-11-28"
            body_format: json
            body:
              message: "Remove the tokens of {{ retire_token_names | join(', ') }}"
              branch: "{{ cac_repository_ref }}"
              sha: "{{ retire_vault_file.json.sha }}"
              content: >-
                {{ retire_vault_file.json.content | b64decode
                | ansible.builtin.unvault(vaulted_cac_vault_password, vault_id='cac')
                | from_yaml
                | combine({'vaulted_aap_instance_tokens': vaulted_aap_instance_tokens
                           | dict2items | rejectattr('key', 'in', retire_token_names) | items2dict})
                | to_nice_yaml
                | ansible.builtin.vault(vaulted_cac_vault_password, vault_id='cac')
                | b64encode }}
            timeout: 30
          changed_when: true
          no_log: true

    - name: Write the live list without the retired versions against the read blob SHA
      ansible.builtin.uri:
        url: "{{ counter_api_url }}"
        method: PUT
        url_username: "{{ counter_git_username }}"
        url_password: "{{ counter_git_token }}"
        force_basic_auth: true
        headers:
          Accept: application/vnd.github+json
          X-GitHub-Api-Version: "2022-11-28"
        body_format: json
        body:
          message: "Retire deployment version(s) {{ retire_labels | join(', ') }}"
          sha: "{{ retire_counter_file.json.sha }}"
          content: >-
            {{ counter_text
            | regex_replace(counter_live_pattern,
                            'autodeploy_deployment_instances_live: '
                            ~ (counter_live | map('int') | reject('in', retire_numbers) | list) | to_json)
            | b64encode }}
        status_code: 200
        timeout: 30
      changed_when: true
      no_log: true
