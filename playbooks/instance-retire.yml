---
# Retire deployment instances named by hand, for example "v24, v25".
#
# Not part of any deployment workflow: several instances may be live at the
# same time, and only a person decides which one is finished. Its own job
# template, started by hand with the versions in the survey.
#
# Everything an instance owns is found by the version in its name; there is no
# separate registry. This version cleans five things:
#   1. the AAP VM on the hypervisor (stopped and undefined) and its disk
#   2. the Let's Encrypt certificate of the AAP name on the hypervisor
#   3. the AAP VM's host in the AAP inventory
#   4. every A record in the zone with the version as a whole label, for
#      example hactar.v24 and aap.v24, but never hactar.v240
#   5. the version in the live list of the deployment counter
# The live list is written last, so a failure leaves the version live and a
# rerun finds everything again.
#
# Extension rule: every later stage that creates something per instance (VMs,
# vhosts, certificates, AAP inventory entries, generated secrets, monitoring)
# adds its own cleanup step here when it is built. Removing the Red Hat
# registration is a planned follow-up; it needs a Red Hat API token.
#
# Required variables, supplied by the job template, its survey, the CaC
# inventory, the Git write credential, the DNS credential and the machine
# credential of the hypervisor, and the standard Red Hat Ansible Automation
# Platform credential, which hands the controller URL and login to
# ansible.controller as environment variables:
#   retire_versions        survey text, versions separated by commas or spaces
#   counter_repository     private repository as owner/name
#   counter_file_path      counter file in that repository, from the CaC inventory
#   counter_git_username   GitHub account that owns the token
#   counter_git_token      token with contents write access to that repository
#   dns_godaddy_token      GoDaddy API token for the zone
#   dns_zone               DNS zone, for example example.com
#   aap_vm_name            AAP VM name, a template on autodeploy_deployment_version
#   aap_vm_disk_path       its disk, a template on aap_vm_name
#   aap_vm_fqdn            AAP name, the name of its certificate
#   aap_inventory_name     AAP inventory the VM's host is recorded in

- name: Check the deployment versions to retire
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    counter_api_url: "https://api.github.com/repos/{{ counter_repository }}/contents/{{ counter_file_path }}"
    counter_live_pattern: '(?m)^autodeploy_deployment_instances_live: \[[0-9, ]*\]$'
  tasks:
    - name: Read the counter file and its blob SHA
      ansible.builtin.uri:
        url: "{{ counter_api_url }}"
        method: GET
        url_username: "{{ counter_git_username }}"
        url_password: "{{ counter_git_token }}"
        force_basic_auth: true
        headers:
          Accept: application/vnd.github+json
          X-GitHub-Api-Version: "2022-11-28"
        return_content: true
        status_code: 200
        timeout: 30
      register: retire_counter_file
      check_mode: false

    - name: Normalise the versions to retire
      ansible.builtin.set_fact:
        counter_text: "{{ retire_counter_file.json.content | b64decode }}"
        counter_number: "{{ (retire_counter_file.json.content | b64decode | from_yaml).autodeploy_deployment_counter_next }}"
        counter_live: "{{ (retire_counter_file.json.content | b64decode | from_yaml).autodeploy_deployment_instances_live }}"
        retire_labels: "{{ retire_tokens | map('regex_replace', '^v?', 'v') | unique | list }}"
        retire_numbers: "{{ retire_tokens | map('regex_replace', '^v?', '') | map('int') | unique | list }}"
      vars:
        retire_tokens: "{{ retire_versions | lower | regex_replace('[,\\s]+', ' ') | trim | split(' ') }}"

    # The live line check makes sure the write below changes exactly that line.
    - name: Require two-digit versions that are all live
      ansible.builtin.assert:
        that:
          - retire_labels | reject('match', '^v[0-9]{2}$') | list | length == 0
          - retire_numbers | length > 0
          - retire_numbers | difference(counter_live | map('int')) | length == 0
          - counter_number | int not in retire_numbers
          - counter_text is ansible.builtin.regex(counter_live_pattern)
        fail_msg: >-
          Give live versions as vXY, separated by commas or spaces. Live now:
          {{ counter_live | join(', ') }}. Nothing was changed.

# A failure here must stop the whole run before DNS and the live list change.
- name: Remove the AAP VMs and certificates of the retired versions
  hosts: autodeploy_target
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    # The CaC names are templates on the deployment version; each item sets it.
    - name: Stop and undefine the AAP VM
      community.libvirt.virt_install:
        name: "{{ aap_vm_name }}"
        state: absent
      loop: "{{ hostvars['localhost'].retire_labels }}"
      vars:
        autodeploy_deployment_version: "{{ item }}"

    - name: Remove the AAP VM disk
      ansible.builtin.file:
        path: "{{ aap_vm_disk_path }}"
        state: absent
      loop: "{{ hostvars['localhost'].retire_labels }}"
      vars:
        autodeploy_deployment_version: "{{ item }}"

    # certbot keeps a certificate in three directories plus its renewal
    # configuration; its own delete removes all of them.
    - name: Delete the certificate of the AAP name
      ansible.builtin.command:
        argv: [certbot, delete, --cert-name, "{{ aap_vm_fqdn }}", --non-interactive]
        removes: "/etc/letsencrypt/live/{{ aap_vm_fqdn }}"
      loop: "{{ hostvars['localhost'].retire_labels }}"
      vars:
        autodeploy_deployment_version: "{{ item }}"

- name: Remove the inventory hosts, DNS names and live list entries of the retired versions
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    counter_api_url: "https://api.github.com/repos/{{ counter_repository }}/contents/{{ counter_file_path }}"
    counter_live_pattern: '(?m)^autodeploy_deployment_instances_live: \[[0-9, ]*\]$'
    dns_api_base: https://api.godaddy.com
  tasks:
    # Before DNS and the live list, so a failure leaves the version live.
    - name: Remove the AAP VM's host from the AAP inventory
      ansible.controller.host:
        name: "{{ aap_vm_name }}"
        inventory: "{{ aap_inventory_name }}"
        state: absent
      loop: "{{ retire_labels }}"
      vars:
        autodeploy_deployment_version: "{{ item }}"

    # A partial list would let names survive while the version leaves the live
    # list, and no rerun would find them again.
    - name: Read all A records of the zone
      ansible.builtin.uri:
        url: >-
          {{ dns_api_base }}/v3/domains/zones/{{ dns_zone | urlencode }}/dns-records?type=A&page=1&pageSize=100&totalRequired=true
        method: GET
        headers:
          Authorization: "Bearer {{ dns_godaddy_token }}"
        return_content: true
        status_code: 200
        timeout: 30
      register: retire_dns_records
      failed_when: >-
        retire_dns_records.status != 200
        or retire_dns_records.json.totalPages | default(1) | int > 1
      check_mode: false

    # DNS first, list second: a failed delete leaves the version live, so a
    # rerun finds its names again. Versions without a record are fine.
    - name: Delete every A record named after a retired version
      ansible.builtin.uri:
        url: "{{ dns_api_base }}/v3/domains/zones/{{ dns_zone | urlencode }}/dns-records/{{ item.recordId | urlencode }}"
        method: DELETE
        headers:
          Authorization: "Bearer {{ dns_godaddy_token }}"
        status_code: 204
        timeout: 30
      loop: >-
        {{ retire_dns_records.json['items']
        | selectattr('name', 'search', '(?i)(^|[.])(' ~ retire_labels | join('|') ~ ')([.]|$)') | list }}
      loop_control:
        label: "{{ item.name }}"
      changed_when: true

    - name: Write the live list without the retired versions against the read blob SHA
      ansible.builtin.uri:
        url: "{{ counter_api_url }}"
        method: PUT
        url_username: "{{ counter_git_username }}"
        url_password: "{{ counter_git_token }}"
        force_basic_auth: true
        headers:
          Accept: application/vnd.github+json
          X-GitHub-Api-Version: "2022-11-28"
        body_format: json
        body:
          message: "Retire deployment version(s) {{ retire_labels | join(', ') }}"
          sha: "{{ retire_counter_file.json.sha }}"
          content: >-
            {{ counter_text
            | regex_replace(counter_live_pattern,
                            'autodeploy_deployment_instances_live: '
                            ~ (counter_live | map('int') | reject('in', retire_numbers) | list) | to_json)
            | b64encode }}
        status_code: 200
        timeout: 30
      changed_when: true
