  - name: community.general
    version: 13.5.0
  - name: community.libvirt
    version: 2.4.0
  - name: ansible.controller
    version: 4.8.11
  # CoP collections for playbooks/aap-cac-apply.yml. They depend on
  # ansible.platform and ansible.hub, which come from the same hub.
